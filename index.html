<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JavaHTML — IDE</title>
<style>
  :root{
    --bg:#1e1e28; --bg2:#252532; --bg3:#2d2d3d; --bg4:#1a1a24;
    --border:#3a3a4e; --border2:#4a4a5e;
    --fg:#d4d4dc; --dim:#808090;
    --orange:#f89820; --orange2:#e07b10;
    --ok:#4ec9b0; --err:#f48771;
    --font:'JetBrains Mono','Consolas','Monaco','Courier New',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--fg);
    display:flex;flex-direction:column;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:14px;padding:0 16px;height:56px;flex-shrink:0;
    background:linear-gradient(180deg,#2a2a3a 0%,var(--bg2) 100%);
    border-bottom:1px solid var(--border);
    box-shadow:0 2px 12px rgba(0,0,0,.3);
    position:relative;z-index:10;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .duke{
    width:44px;height:44px;border-radius:10px;overflow:hidden;
    display:grid;place-items:center;flex-shrink:0;
    box-shadow:0 4px 16px rgba(248,152,32,.35);
    background:var(--bg3);
  }
  .duke img{width:100%;height:100%;display:block;object-fit:cover}
  .brand-text h1{font-size:16px;font-weight:800;letter-spacing:.4px;line-height:1.1}
  .brand-text h1 span{color:var(--orange)}
  .brand-text small{font-size:10.5px;color:var(--dim);letter-spacing:.3px;display:block;margin-top:2px}
  .controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  select,button{
    font-family:inherit;font-size:12px;font-weight:600;border-radius:6px;
    border:1px solid var(--border);background:var(--bg3);color:var(--fg);
    padding:7px 11px;cursor:pointer;transition:.15s;
  }
  select:hover,button:hover{border-color:var(--border2);background:#343445}
  button.primary{
    background:linear-gradient(180deg,var(--orange),var(--orange2));
    border-color:var(--orange2);color:#1a1000;
  }
  button.primary:hover{filter:brightness(1.1)}
  button.primary:active{transform:translateY(1px)}
  button.icon-btn{padding:7px 10px;font-size:13px}
  .tabbar{
    display:flex;align-items:flex-end;gap:1px;padding:6px 8px 0;
    background:var(--bg4);border-bottom:1px solid var(--border);flex-shrink:0;
    overflow-x:auto;min-height:36px;
  }
  .tab{
    display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12px;
    background:var(--bg3);color:var(--dim);border:1px solid var(--border);
    border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;
    transition:.15s;position:relative;top:1px;
  }
  .tab:hover{background:#343445;color:var(--fg)}
  .tab.active{background:var(--bg2);color:var(--orange);border-color:var(--border);top:0;padding-bottom:8px}
  .tab.active::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--orange)}
  .tab .close{opacity:.5;font-size:14px;line-height:1;padding:0 2px;border-radius:3px}
  .tab .close:hover{opacity:1;background:rgba(244,135,113,.3);color:var(--err)}
  .tab .modified{color:var(--orange)}
  .tab-new{padding:7px 12px;font-size:16px;color:var(--dim);background:transparent;border:none;cursor:pointer;border-radius:6px}
  .tab-new:hover{background:var(--bg3);color:var(--orange)}
  main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;min-height:0}
  .pane{
    display:flex;flex-direction:column;background:var(--bg2);
    border:1px solid var(--border);border-radius:8px;overflow:hidden;min-height:0;
  }
  .pane-toolbar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:6px 10px;background:var(--bg3);border-bottom:1px solid var(--border);
    font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  }
  .pane-toolbar .badge{
    background:var(--bg4);color:var(--orange);padding:2px 8px;border-radius:10px;
    font-size:10px;font-weight:700;letter-spacing:.3px;
  }
  .editor-wrap{
    flex:1;display:flex;min-height:0;background:#1a1a24;position:relative;overflow:hidden;
  }
  .line-numbers{
    padding:12px 6px 12px 10px;color:#4a4a5a;
    font-family:var(--font);font-size:13px;line-height:1.55;
    text-align:right;user-select:none;background:#15151e;border-right:1px solid #2a2a38;
    min-width:44px;white-space:pre;overflow:hidden;
  }
  .editor-inner{flex:1;position:relative;overflow:hidden}
  .highlight,.editor-inner textarea{
    position:absolute;top:0;left:0;width:100%;height:100%;
    padding:12px 14px;font-family:var(--font);font-size:13px;line-height:1.55;
    border:0;outline:0;resize:none;background:transparent;color:var(--fg);
    white-space:pre;overflow:auto;tab-size:4;-moz-tab-size:4;
    letter-spacing:0;word-wrap:normal;direction:ltr;text-align:left;
  }
  .highlight{color:var(--fg);pointer-events:none;z-index:1}
  .editor-inner textarea{
    color:transparent;caret-color:var(--orange);z-index:2;
    -webkit-text-fill-color:transparent;background:transparent;
  }
  .editor-inner textarea::selection{background:rgba(248,152,32,.3);-webkit-text-fill-color:transparent}
  .kw{color:var(--orange);font-weight:600}
  .str{color:#ce9178}
  .num{color:#b5cea8}
  .cmt{color:#6a737d;font-style:italic}
  .cls{color:var(--ok)}
  .lit{color:#569cd6}
  .console-out{
    flex:1;overflow:auto;padding:12px 14px;
    font-family:var(--font);font-size:13px;line-height:1.55;
    white-space:pre-wrap;word-break:break-word;color:#c8c8d0;
    background:#1a1a24;
  }
  .console-out .c-err{color:var(--err)}
  .console-out .c-ok{color:var(--ok)}
  .console-out .c-dim{color:var(--dim)}
  .console-out .c-hdr{color:var(--orange);font-weight:700}
  footer{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:5px 16px;background:var(--bg2);border-top:1px solid var(--border);
    font-size:11px;color:var(--dim);flex-shrink:0;
  }
  .status{display:flex;align-items:center;gap:7px;font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .dot.busy{background:var(--orange);box-shadow:0 0 6px var(--orange);animation:pulse .8s infinite}
  .dot.bad{background:var(--err);box-shadow:0 0 6px var(--err)}
  @keyframes pulse{50%{opacity:.35}}
  .footer-info{display:flex;align-items:center;gap:12px}
  .footer-info span{font-family:var(--font);font-size:10.5px}
  @media(max-width:860px){
    main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    .controls select{max-width:120px}
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#3a3a4e;border-radius:10px}
  ::-webkit-scrollbar-thumb:hover{background:#4a4a5e}
</style>
</head>
<body>

<div class="tabbar" id="tabbar"></div>

<main>

<footer>
